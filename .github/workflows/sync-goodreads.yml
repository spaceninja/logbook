name: Sync Goodreads

# Runs the Goodreads RSS sync (scripts/sync-goodreads.ts) daily against prod.
# Requires these repo secrets, all pointing at the prod Firebase project:
#   FIREBASE_SERVICE_ACCOUNT — raw JSON of a prod service-account key
#   GOODREADS_USER_ID        — numeric Goodreads user id
#   GOODREADS_RSS_KEY        — the `key` param from a shelf RSS URL
#   NUXT_HARDCOVER_TOKEN     — optional; tag enrichment is skipped without it

on:
  schedule:
    # 12:17 UTC daily — early morning Pacific, off the hour to dodge peak load.
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview changes without writing to Firestore'
        type: boolean
        default: false

concurrency:
  group: sync-goodreads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7.0.1
      - name: Setup Node env 🏗
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies 👨🏻‍💻
        run: npm ci
      - name: Sync Goodreads shelves 📚
        run: npm run sync:goodreads ${{ inputs.dry-run && '-- --dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          GOODREADS_RSS_KEY: ${{ secrets.GOODREADS_RSS_KEY }}
          NUXT_HARDCOVER_TOKEN: ${{ secrets.NUXT_HARDCOVER_TOKEN }}
